<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva | Sabor Andino Gourmet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #121212;
            color: #f1f1f1;
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            background-color: rgba(0, 0, 0, 0.85);
        }

        .navbar-brand {
            font-weight: bold;
            color: #d4a373 !important;
            letter-spacing: 1px;
        }

        .nav-link {
            color: #f1f1f1 !important;
            margin-right: 10px;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: #d4a373 !important;
        }

        .hero {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), url('IMG/fondo.jpg') no-repeat center center/cover;
            height: 65vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 30px;
            border-radius: 10px;
        }

        .form-section {
            padding: 80px 0;
        }

        .form-section h2 {
            color: #d4a373;
            margin-bottom: 30px;
            text-align: center;
        }

        .form-control, .form-select {
            background-color: #1e1e1e;
            color: #fff;
            border: 1px solid #d4a373;
        }

        .form-control:focus, .form-select:focus {
            border-color: #d4a373;
            box-shadow: 0 0 10px rgba(212, 163, 115, 0.5);
        }

        .btn-reserva {
            background-color: #d4a373;
            color: #000;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-reserva:hover {
            background-color: #b8865d;
            color: #fff;
        }

        footer {
            background-color: #000;
            color: #ccc;
            text-align: center;
            padding: 25px 0;
            margin-top: 40px;
        }

        footer a {
            color: #d4a373;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Tierra Sagrada</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="carta.html">Carta</a></li>
                    <li class="nav-item"><a class="nav-link active" href="reserva.html">Reserva</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <h1>Reserva tu Mesa</h1>
    </section>

    <!-- Formulario de Reserva -->
    <section class="form-section">
        <div class="container">
            <h2>Haz tu Reserva</h2>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <form id="formReserva">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="ejemplo@gmail.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" placeholder="+51 999 999 999" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="fecha" class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="fecha" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="hora" class="form-label">Hora</label>
                                <input type="time" class="form-control" id="hora" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="personas" class="form-label">Número de personas</label>
                            <select class="form-select" id="personas" required>
                                <option value="">Selecciona...</option>
                                <option value="1">1 persona</option>
                                <option value="2">2 personas</option>
                                <option value="3">3 personas</option>
                                <option value="4">4 personas</option>
                                <option value="5">5 personas</option>
                                <option value="6">6 personas</option>
                                <option value="7+">Más de 6</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Mensaje adicional (opcional)</label>
                            <textarea class="form-control" id="mensaje" rows="3" placeholder="¿Algún pedido especial?"></textarea>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-reserva px-5 py-2">Enviar Reserva</button>
                        </div>
                    </form>
                    <div id="mensajeExito" class="mt-4 text-center" style="display:none;">
                        <h5 class="text-success">✅ ¡Tu reserva ha sido enviada con éxito!</h5>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Sabor Andino Gourmet. Todos los derechos reservados.</p>
        <p><a href="#">Volver arriba</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Script de simulación de envío
        document.getElementById("formReserva").addEventListener("submit", function(e) {
            e.preventDefault();
            document.getElementById("mensajeExito").style.display = "block";
            this.reset();
        });
    </script>
</body>
</html>
